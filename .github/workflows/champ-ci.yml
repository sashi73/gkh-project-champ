# GKH Project Champ: the automated tests.
# On every pull request (about 2 minutes): 1. every file parses, 2. the quick check, 3. the storage test (tools/storage-test.mjs) (tools/champ-quick.mjs: the server,
#   every page and the files it loads, signing in, projects, plans, Today, Ask Champ, the website chat; no browser).
# Every night at 12 am Sydney (13:00 UTC; 11 pm during Sydney winter time) and on demand (Actions > Champ tests > Run workflow):
#   the full end-to-end suite (tools/champ-test.cjs, Playwright + Chromium, ~470 checks of the website, the console,
#   AI features, documents, lessons and the watch), against main.
# CodeRabbit reviews each pull request too (see .coderabbit.yaml).
name: Champ tests
on:
  pull_request:
    branches: [main, GKH-Project-Champ]
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: champ-ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # a throwaway Postgres for the storage test (Blobs vs Postgres must give the same answers)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: champ
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci || npm install
      - name: Every file parses
        run: |
          for f in netlify/functions/*.mjs netlify/lib/*.mjs admin/*.js assets/*.js assets/help/*.js tools/*.cjs tools/*.mjs; do node --check "$f" || exit 1; done
      - name: Quick check
        shell: bash
        run: |
          set -o pipefail
          node tools/champ-quick.mjs . 2>&1 | tee champ-quick.log
      - name: Storage test (Blobs and Postgres give the same answers)
        shell: bash
        env:
          CHAMP_TEST_DATABASE_URL: postgres://postgres:champ@localhost:5432/postgres
        run: |
          set -o pipefail
          node tools/storage-test.mjs 2>&1 | tee -a champ-quick.log
      - name: Result
        if: always()
        shell: bash
        run: |
          P=$(grep -c '^PASS' champ-quick.log || true); F=$(grep -c '^FAIL' champ-quick.log || true)
          echo "### Project Champ quick check: $P passed, $F failed (the full suite runs nightly)" >> "$GITHUB_STEP_SUMMARY"
          grep '^FAIL' champ-quick.log | head -40 | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true

  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          npm ci || npm install
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils python3-pil   # pdfinfo, pdftotext, pdftoppm and Pillow: the tests read the PDFs Champ makes
      - name: Every file parses
        run: |
          for f in netlify/functions/*.mjs netlify/lib/*.mjs admin/*.js assets/*.js assets/help/*.js tools/*.cjs tools/*.mjs; do node --check "$f" || exit 1; done
      - name: End-to-end tests
        shell: bash
        run: |
          set -o pipefail
          node tools/champ-test.cjs . 2>&1 | tee champ-test.log
      - name: Result
        if: always()
        shell: bash
        run: |
          P=$(grep -c '^PASS' champ-test.log || true); F=$(grep -c '^FAIL' champ-test.log || true)
          echo "### Project Champ tests: $P passed, $F failed" >> "$GITHUB_STEP_SUMMARY"
          grep '^FAIL\|CRASH' champ-test.log | head -40 | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
          [ "$F" = "0" ] && ! grep -q CRASH champ-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: champ-test-log
          path: champ-test.log
